name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        required: false
        default: "full"
        type: choice:
          options:
            - full
            - cli

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 创建 venv 并安装依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install pyinstaller textual httpx tomli-w

      - name: 验证 API 密钥未被打包
        shell: pwsh
        run: |
          $secret = "sk-as-"
          $hits = Get-ChildItem -Recurse -Path . -File |
                  Select-String -Pattern $secret -Quiet
          if ($hits) {
              Write-Error "发现 API 密钥泄露！"
              exit 1
          }
          Write-Host "密钥检查通过"

      - name: 构建完整版（含 TUI）
        if: ${{ inputs.target == 'full' || github.event_name == 'push' }}
        run: |
          .\.venv\Scripts\python.exe Supporter/build_windows.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zhengtong-windows
          path: dist/zhengtong/

      - name: 上传 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zhengtong/zhengtong.exe
          generate_release_notes: true