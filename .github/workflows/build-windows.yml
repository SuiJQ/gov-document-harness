name: build-windows

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - cli

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 创建 venv 并安装依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install pyinstaller textual httpx tomli-w

      - name: 清理 .git 中的 token（推送 URL 残留）
        shell: pwsh
        run: |
          # git remote URL 可能含 token，清理后再做密钥扫描
          $url = git config --get remote.origin.url
          if ($url -match "ghp_") {
              git remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
              Write-Host "已清理 remote URL 中的 token"
          }

      - name: 验证 API 密钥未被打包
        shell: pwsh
        run: |
          $secret = "sk-as-"
          # 排除 .git（可能含推送 token 残留）和 dist/build（构建产物）
          $allFiles = Get-ChildItem -Recurse -Path . -File |
                      Where-Object { $_.FullName -notmatch '\\.git\\' -and $_.FullName -notmatch '\\dist\\' -and $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\.github\\' }
          $hits = $allFiles | Select-String -Pattern $secret
          if ($hits) {
              Write-Error "发现 API 密钥泄露！"
              $hits | ForEach-Object { Write-Host "  命中: $($_.Path):$($_.LineNumber)" }
              exit 1
          }
          Write-Host "密钥检查通过（扫描 $($allFiles.Count) 个文件）"

      - name: 构建完整版（含 TUI）
        if: ${{ inputs.target == 'full' || github.event_name == 'push' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          .\.venv\Scripts\python.exe Supporter/build_windows.py 2>&1 | Write-Output
          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller 构建失败，退出码: $LASTEXITCODE"
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zhengtong-windows
          path: 政通Harness/dist/zhengtong/

      - name: 上传 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zhengtong/zhengtong.exe
          generate_release_notes: true