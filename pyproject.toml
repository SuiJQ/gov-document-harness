[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongwen-harness"
version = "0.1.0"
description = "党政公文写作专家团系统"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gongwen = "gongwen.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
